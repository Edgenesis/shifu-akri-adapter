defaultNamespace: devices
helm:
  chart: akri
  repo: https://project-akri.github.io/akri/
  version: 0.13.8
  values:
    custom:
      discovery:
        enabled: true
        image:
          repository: edgenesis/shifu-akri-rtsp-discovery
          tag: nightly
        name: akri-rtsp-discovery
      configuration:
        enabled: true
        name: rtsp
        discoveryHandlerName: rtsp
        discoveryDetails: "devices.test.edgenesis.io:40554"
        brokerProperties:
          DEVICESHIFU_CONFIG: akri-rtsp-configmap
    opcua:
      discovery:
        enabled: true
      configuration:
        enabled: true
        name: akri-opcua-led
        brokerProperties:
          DEVICESHIFU_CONFIG: configmap-led
        discoveryDetails:
          discoveryUrls:
            - "opc.tcp://devices.test.edgenesis.io:44840"
dependsOn:
  - name: shifu-akri-demo-fleet-shifu
